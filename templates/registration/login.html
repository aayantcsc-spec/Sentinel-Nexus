{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Sentinel Nexus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="brand justify-content-center mb-4">
      <span class="brand-mark">SN</span>
      <span><strong>Sentinel</strong><small>Nexus</small></span>
    </div>
    <p class="eyebrow text-center">Secure operations platform</p>
    <h1 class="text-center mb-4">Welcome back</h1>
    {% if form.errors %}<div class="alert alert-danger">Enter a valid username and password.</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Username</label>
        <input class="form-control" type="text" name="username" id="id_username" autocomplete="username" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label" for="id_password">Password</label>
        <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Sign in</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
  </div>
</body>
</html>
